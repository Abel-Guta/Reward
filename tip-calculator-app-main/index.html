<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link  rel="stylesheet" href="./index.css">
  
  <title>Tip calculator app</title>
  <script src="index.js" defer></script>


  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class ="outer">
    <div class="calculator">
      <div class="bill">
        <h3>Bill</h3>
        <div class="input">
          <img src="./images/icon-dollar.svg"/>
          <input id="inputMoney" type="number" placeholder="0"/>
        </div>
        
      </div>
      <div class="tip">
       
        <h3>
  Select Tip %</h3>

        <div class="options">  <button class="chooser" data-value="5">
          5%
        </button><button class="chooser" data-value="10"> 10%</button>
        <button class="chooser" data-value="15"> 15%</button>
        <button class="chooser" data-value="25"> 25%</button>
        <button class="chooser " data-value="50"> 50%</button>
        <div class="custom"> <input id="inputcustomTip" class="custom" placeholder="Custom"/></div>
      </div></div>
       
      <div class="people">
        <div class="notf"><h3> Number of People</h3>
          <h3 class="error" id="error">Can't be zero</h3>
        </div>
        
         <div class="input">
          <img src="./images/icon-person.svg"/>
          <input id="inputPeople" type="number" placeholder="0"/>
        </div>
      </div>

    </div>
    <div class="calcresult">
       <div class="upper"> <div class="tipAmount">
       
       <div class="left">
           <h4> Tip Amount</h4>
           <span>  /person</span>
       </div>
           <p id="perPerson">$0.00</p>
        </div>
         <div class ="total">
       <div class="left">
           <h4>  Total</h4>
           <span>  /person</span>
       </div>
            <p id="total">$0.00</p>
        </div></div>
     
         <button id="reset">Reset</button>

       
        
      </div>
      
      
    </div>
      </div>
     
  </div>

  

  
  

 

 


 
  


  
  
</body>
</html>
