<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link  rel="stylesheet" href="./index.css">
  
  <title>Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class ="outer">
    <div class="calculator">
      <div class="bill">
        <h3>Bill</h3>
        <div class="input">
          <img src="./images/icon-dollar.svg"/>
          <input type="number" placeholder="0"/>
        </div>
        
      </div>
      <div class="tip">
       
        <h3>
  Select Tip %</h3>

        <div class="options">  <div class="chooser">
          <p>5%</p>
        </div><div class="chooser"> <p>10%</p></div>
        <div class="chooser"> <p>15%</p></div>
        <div class="chooser"> <p>25%</p></div>
        <div class="chooser"> <p>50%</p></div>
        <div class="chooser"> <input class="custom" placeholder="Custom"/></div>
      </div></div>
       
      <div class="people">
        <h3> Number of People</h3>
         <div class="input">
          <img src="./images/icon-person.svg"/>
          <input type="number" placeholder="0"/>
        </div>
      </div>

    </div>
    <div class="calcresult">
      <div class="tipAmount">
        <p>
           <h4> Tip Amount</h4>
           <span>  / person</span>
           </p>
        </div>
         <div class ="total">
       <p>
           <h4>  Total</h4>
           <span>  / person</span>
        </div></p>
        <h2></h2>
        <button>Reset</button>
      </div>
      
    </div>
        <h2></h2>
      </div>
     
  </div>

  

  
  

 

 


 
  


  
  
</body>
</html>
